[package]
name = "wasm-example"
version = "0.0.0"
edition = "2024"
publish = false
description = "Using nuts-rs from JavaScript through wasm32-unknown-unknown"

[lib]
# cdylib for the .wasm module, rlib for the tests
crate-type = ["cdylib", "rlib"]

[dependencies]
# Without `parallel`, the sampler runs on the calling thread.
nuts-rs = { path = "..", default-features = false, features = ["arrow"] }
nuts-storable = { path = "../nuts-storable" }
anyhow = "1.0.72"
arrow = { version = "59.0.0", default-features = false }
rand = "0.10.0"
thiserror = "2.0.3"
wasm-bindgen = "0.2"

[dev-dependencies]
wasm-bindgen-test = "0.3"
